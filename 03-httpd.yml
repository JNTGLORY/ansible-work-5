---
- name: install HTTP servers
  hosts: n2
  become: yes

  tasks:
  - name: install HTTPD
    yum: 
      name: /home/ec2-user/new_dir
      state: present

  - name: start Httpd
    service: 
      name: httpd
      state: started 

  - name: Enable Httpd
    service: 
      name: httpd
      Enable: yes     
...        
